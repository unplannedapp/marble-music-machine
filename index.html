<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Marble Music Machine</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #2b2a33; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      #hud {
        position: fixed; left: 16px; top: 12px; color: #f2f0f7; font: 500 13px/1.5 system-ui, sans-serif;
        pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,.6); white-space: pre;
      }
      #game-hud { position: fixed; inset: 0; pointer-events: none; font-family: system-ui, -apple-system, sans-serif; color: #f2f0f7; }
      .hud-stat { position: absolute; top: calc(14px + env(safe-area-inset-top)); display: flex; flex-direction: column; gap: 2px; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
      .hud-stat .label { font-size: 12px; letter-spacing: 0.12em; opacity: 0.75; }
      .hud-stat .value { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
      .hud-combo { left: calc(18px + env(safe-area-inset-left)); }
      .hud-combo.lost .value { color: #ff6b6b; }
      .hud-score { right: calc(18px + env(safe-area-inset-right)); align-items: flex-end; }
      .hud-pop { position: absolute; transform: translate(-50%, -120%); font-weight: 800; font-size: 22px; letter-spacing: 0.04em; white-space: nowrap; animation: hud-pop 0.9s ease-out forwards; text-shadow: 0 2px 6px rgba(0,0,0,.7); }
      .hud-pop.lyric { transform: translate(-50%, 40%); font-size: 30px; color: #fff; animation-name: hud-lyric; }
      .rating-perfect { color: #ffd84a; } .rating-exact { color: #ffb347; } .rating-good { color: #7fe0ff; }
      .rating-early, .rating-late { color: #c9c4ff; } .rating-miss { color: #ff6b6b; }
      @keyframes hud-pop { 0% { opacity: 0; transform: translate(-50%, -100%) scale(0.7); } 15% { opacity: 1; transform: translate(-50%, -130%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -220%) scale(1); } }
      @keyframes hud-lyric { 0% { opacity: 0; transform: translate(-50%, 60%) scale(0.8); } 15% { opacity: 1; transform: translate(-50%, 40%) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, 90%) scale(1); } }
      #hud-results { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      #hud-results[hidden] { display: none; }
      #hud-results .card { background: rgba(24, 22, 32, 0.85); border-radius: 18px; padding: 22px 28px; min-width: 240px; text-align: center; backdrop-filter: blur(8px); }
      #hud-results .title { font-size: 14px; letter-spacing: 0.1em; opacity: 0.8; }
      #hud-results .big { font-size: 44px; font-weight: 800; margin: 6px 0; font-variant-numeric: tabular-nums; }
      #hud-results .sub { opacity: 0.8; margin-bottom: 12px; }
      #hud-results .row { display: flex; justify-content: space-between; gap: 24px; font-size: 14px; padding: 2px 0; font-variant-numeric: tabular-nums; }
      #hud-results .hint { margin-top: 12px; font-size: 12px; opacity: 0.6; }
      .hud-btn { position: fixed; width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid rgba(242,240,247,.7); background: rgba(24,22,32,.45); color: #f2f0f7; font: 600 16px system-ui, sans-serif; display: flex; align-items: center; justify-content: center; cursor: pointer; -webkit-tap-highlight-color: transparent; z-index: 5; }
      #btn-pause { right: calc(18px + env(safe-area-inset-right)); top: calc(78px + env(safe-area-inset-top)); }
      #btn-tune { right: calc(18px + env(safe-area-inset-right)); bottom: calc(18px + env(safe-area-inset-bottom)); font-size: 12px; opacity: 0.6; }
      #hint {
        position: fixed; left: 16px; bottom: 12px; color: rgba(242,240,247,.65); font: 12px/1.5 system-ui, sans-serif;
        pointer-events: none;
      }
      .lil-gui { --width: 280px; }
      #start {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 12px; background: rgba(28, 26, 36, 0.55); color: #f2f0f7; font: 500 15px/1.4 system-ui, sans-serif;
        cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
      }
      #start[hidden] { display: none; }
      .menu-title { font-size: 28px; font-weight: 600; letter-spacing: 0.02em; }
      .menu-sub { opacity: 0.75; margin-bottom: 10px; }
      .menu-list { display: flex; flex-direction: column; gap: 10px; width: min(360px, 88vw); }
      .menu-item { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; text-align: left; padding: 14px 16px; border-radius: 14px; border: 1.5px solid rgba(242,240,247,.35); background: rgba(24,22,32,.6); color: #f2f0f7; font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
      .menu-item:hover, .menu-item:focus-visible { border-color: #ffd84a; outline: none; }
      .menu-item .name { font-size: 17px; font-weight: 600; grid-column: 1; }
      .menu-item .meta { font-size: 12px; opacity: 0.7; grid-column: 1; }
      .menu-item .best { grid-column: 2; grid-row: 1 / span 2; align-self: center; font-size: 13px; color: #ffd84a; font-variant-numeric: tabular-nums; }
      #hud-results .actions { margin-top: 10px; }
      #hud-results .actions button { pointer-events: auto; padding: 8px 18px; border-radius: 999px; border: 1.5px solid rgba(242,240,247,.6); background: transparent; color: #f2f0f7; font: 600 14px system-ui, sans-serif; cursor: pointer; }
      #hud-results { pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="game-hud"></div>
    <button id="btn-pause" class="hud-btn" aria-label="Pause">❚❚</button>
    <button id="btn-tune" class="hud-btn" aria-label="Tuning panel">tune</button>
    <div id="hint" hidden>R reset · Space pause · . step · C free camera</div>
    <div id="start"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
