<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Marble Music Machine</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #2b2a33; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      #hud {
        position: fixed; left: 16px; top: 12px; color: #f2f0f7; font: 500 13px/1.5 system-ui, sans-serif;
        pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,.6); white-space: pre;
      }
      #game-hud { position: fixed; inset: 0; z-index: 2; pointer-events: none; font-family: system-ui, -apple-system, sans-serif; color: #f2f0f7; }
      .hud-stat { position: absolute; top: calc(14px + env(safe-area-inset-top)); display: flex; flex-direction: column; gap: 2px; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
      .hud-stat .label { font-size: 12px; letter-spacing: 0.12em; opacity: 0.75; }
      .hud-stat .value { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
      .hud-combo { left: calc(18px + env(safe-area-inset-left)); }
      .hud-combo.lost .value { color: #ff6b6b; }
      .hud-score { right: calc(18px + env(safe-area-inset-right)); align-items: flex-end; }
      .hud-pop { position: absolute; transform: translate(-50%, -120%); font-weight: 800; font-size: 22px; letter-spacing: 0.04em; white-space: nowrap; animation: hud-pop 0.9s ease-out forwards; text-shadow: 0 2px 6px rgba(0,0,0,.7); }
      .hud-pop.lyric { transform: translate(-50%, 40%); font-size: 30px; color: #fff; animation-name: hud-lyric; }
      .rating-perfect { color: #ffd84a; } .rating-exact { color: #ffb347; } .rating-good { color: #7fe0ff; }
      .rating-early, .rating-late { color: #c9c4ff; } .rating-miss { color: #ff6b6b; }
      @keyframes hud-pop { 0% { opacity: 0; transform: translate(-50%, -100%) scale(0.7); } 15% { opacity: 1; transform: translate(-50%, -130%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -220%) scale(1); } }
      @keyframes hud-lyric { 0% { opacity: 0; transform: translate(-50%, 60%) scale(0.8); } 15% { opacity: 1; transform: translate(-50%, 40%) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, 90%) scale(1); } }
      #hud-results { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      #hud-results[hidden] { display: none; }
      #hud-results .card { background: rgba(24, 22, 32, 0.85); border-radius: 18px; padding: 22px 28px; min-width: 240px; text-align: center; backdrop-filter: blur(8px); }
      #hud-results .title { font-size: 14px; letter-spacing: 0.1em; opacity: 0.8; }
      #hud-results .big { font-size: 44px; font-weight: 800; margin: 6px 0; font-variant-numeric: tabular-nums; }
      #hud-results .sub { opacity: 0.8; margin-bottom: 12px; }
      #hud-results .row { display: flex; justify-content: space-between; gap: 24px; font-size: 14px; padding: 2px 0; font-variant-numeric: tabular-nums; }
      #hud-results .hint { margin-top: 12px; font-size: 12px; opacity: 0.6; }
      .hud-btn { position: fixed; width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid rgba(242,240,247,.7); background: rgba(24,22,32,.45); color: #f2f0f7; font: 600 16px system-ui, sans-serif; display: flex; align-items: center; justify-content: center; cursor: pointer; -webkit-tap-highlight-color: transparent; z-index: 5; }
      #btn-pause { right: calc(18px + env(safe-area-inset-right)); top: calc(78px + env(safe-area-inset-top)); }
      #btn-tune { right: calc(18px + env(safe-area-inset-right)); bottom: calc(18px + env(safe-area-inset-bottom)); font-size: 12px; opacity: 0.6; }
      #editor { position: fixed; inset: 0; z-index: 2; pointer-events: none; font-family: system-ui, -apple-system, sans-serif; color: #f2f0f7; }
      #editor[hidden] { display: none; }
      #editor button, #editor select, #editor input, #editor textarea { pointer-events: auto; font: inherit; }
      .ed-bar { position: absolute; left: 0; right: 0; top: env(safe-area-inset-top); display: flex; justify-content: space-between; gap: 8px; padding: 10px; flex-wrap: wrap; }
      .ed-palette, .ed-actions { display: flex; gap: 6px; flex-wrap: wrap; }
      #editor .ed-bar button { padding: 8px 12px; border-radius: 999px; border: 1.5px solid rgba(242,240,247,.5); background: rgba(24,22,32,.75); color: #f2f0f7; font-size: 13px; cursor: pointer; backdrop-filter: blur(6px); }
      #editor .ed-bar button.primary { background: #ffd84a; color: #1b1a22; border-color: #ffd84a; font-weight: 700; }
      .ed-inspector { position: absolute; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); background: rgba(24,22,32,.85); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; backdrop-filter: blur(8px); max-width: 420px; margin: 0 auto; pointer-events: auto; }
      .ed-inspector .ed-title { font-weight: 700; text-transform: capitalize; }
      .ed-inspector .ed-id { opacity: 0.5; font-weight: 400; font-size: 12px; margin-left: 6px; text-transform: none; }
      .ed-inspector label { display: grid; grid-template-columns: 80px 1fr 48px; align-items: center; gap: 8px; font-size: 13px; }
      .ed-inspector label span { text-align: right; font-variant-numeric: tabular-nums; opacity: 0.8; }
      .ed-inspector select { background: #2b2a36; color: #f2f0f7; border: 1px solid rgba(242,240,247,.3); border-radius: 8px; padding: 6px; grid-column: 2 / span 2; }
      .ed-inspector input[type=range] { width: 100%; }
      .ed-colors { display: flex; gap: 6px; }
      .ed-colors button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
      .ed-colors button.on { border-color: #fff; }
      .ed-inspector .row, .ed-more .row { display: flex; gap: 8px; }
      .ed-inspector .row button, .ed-more .row button { flex: 1; padding: 8px; border-radius: 10px; border: 1.5px solid rgba(242,240,247,.4); background: transparent; color: #f2f0f7; cursor: pointer; }
      .ed-inspector .row button.danger { border-color: #ff6b6b; color: #ff6b6b; }
      .ed-empty { opacity: 0.7; font-size: 13px; }
      .ed-more { position: absolute; right: 10px; top: calc(62px + env(safe-area-inset-top)); width: min(360px, calc(100vw - 20px)); background: rgba(24,22,32,.9); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; pointer-events: auto; backdrop-filter: blur(8px); }
      .ed-more[hidden] { display: none; }
      .ed-more label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
      .ed-more input, .ed-more select, .ed-more textarea { background: #2b2a36; color: #f2f0f7; border: 1px solid rgba(242,240,247,.3); border-radius: 8px; padding: 6px; font-size: 13px; }
      .ed-hint { font-size: 12px; opacity: 0.7; }
      .menu-item { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 10px; }
      .menu-item .play { display: flex; flex-direction: column; text-align: left; background: none; border: 0; color: inherit; padding: 0; cursor: pointer; font: inherit; }
      .menu-item .edit { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid rgba(242,240,247,.35); background: transparent; color: #f2f0f7; cursor: pointer; }
      .menu-new { margin-top: 6px; padding: 10px 18px; border-radius: 999px; border: 1.5px dashed rgba(242,240,247,.5); background: transparent; color: #f2f0f7; font: inherit; cursor: pointer; }
      .menu-mine { margin-top: 14px; }
      .menu-mine[hidden] { display: none; }
      #hint {
        position: fixed; left: 16px; bottom: 12px; color: rgba(242,240,247,.65); font: 12px/1.5 system-ui, sans-serif;
        pointer-events: none;
      }
      .lil-gui { --width: 280px; }
      #start {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 12px; background: rgba(28, 26, 36, 0.55); color: #f2f0f7; font: 500 15px/1.4 system-ui, sans-serif;
        cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
      }
      #start[hidden] { display: none; }
      .menu-title { font-size: 28px; font-weight: 600; letter-spacing: 0.02em; }
      .menu-sub { opacity: 0.75; margin-bottom: 10px; }
      .menu-list { display: flex; flex-direction: column; gap: 10px; width: min(360px, 88vw); }
      .menu-item { padding: 12px 14px; border-radius: 14px; border: 1.5px solid rgba(242,240,247,.35); background: rgba(24,22,32,.6); color: #f2f0f7; font: inherit; -webkit-tap-highlight-color: transparent; }
      .menu-item .name { font-size: 17px; font-weight: 600; }
      .menu-item .meta { font-size: 12px; opacity: 0.7; }
      .menu-item .best { font-size: 13px; color: #ffd84a; font-variant-numeric: tabular-nums; }
      #hud-results .actions { margin-top: 10px; }
      #hud-results .actions button { pointer-events: auto; padding: 8px 18px; border-radius: 999px; border: 1.5px solid rgba(242,240,247,.6); background: transparent; color: #f2f0f7; font: 600 14px system-ui, sans-serif; cursor: pointer; }
      #hud-results { pointer-events: none; }
    .notice { position: fixed; left: 50%; bottom: 14%; transform: translateX(-50%); max-width: 80vw; padding: 10px 14px; border-radius: 10px; background: rgba(20, 18, 28, 0.85); color: #f3e9ff; font: 14px/1.4 system-ui, sans-serif; text-align: center; z-index: 30; pointer-events: none; }
    .vignette { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.35;
  background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.75) 100%); }
</style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="game-hud"></div>
    <button id="btn-pause" class="hud-btn" aria-label="Pause">❚❚</button>
    <button id="btn-tune" class="hud-btn" aria-label="Tuning panel">tune</button>
    <div id="hint" hidden>R reset · Space pause · . step · C free camera</div>
    <div id="start"></div>
    <div id="editor" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
